  <!-- Filet de sécurité anti-page-blanche.

       Volontairement en JavaScript ordinaire, hors de tout <script type="text/babel">
       et sans dépendre du CSS : c'est justement quand un de ces maillons casse
       (fichier absent du cache après une mise à jour, transpilation en échec,
       CDN injoignable) que l'application ne monte rien et que l'utilisateur se
       retrouve devant un écran vide, sans le moindre indice.

       On ne diagnostique pas : on redonne la main. La cause de loin la plus
       probable étant un cache de service worker incohérent, le bouton purge le
       cache et recharge. -->
  <script>
    (function () {
      var shown = false;
      function showFallback(detail) {
        if (shown) return;
        var root = document.getElementById("root");
        if (!root || root.children.length > 0) return;   // l'app a bien monté
        shown = true;
        root.innerHTML =
          '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
          'padding:24px;background:#070b14;color:#dbe7f5;' +
          'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">' +
            '<div style="max-width:340px;text-align:center">' +
              '<div style="font-size:11px;letter-spacing:.28em;color:#7ce0ff">FOCUDE</div>' +
              '<h1 style="font-size:17px;font-weight:500;margin:14px 0 10px">Le chargement a échoué.</h1>' +
              '<p style="font-size:13px;line-height:1.55;color:#9fb4cc;margin:0 0 18px">' +
                'Une version incomplète est restée en mémoire sur cet appareil. ' +
                'Vider le cache local remet l\'application d\'aplomb — tes données ' +
                'de compte ne sont pas touchées.</p>' +
              '<button id="__focude_reset" style="width:100%;min-height:44px;border-radius:10px;' +
              'border:1px solid #2b4a6e;background:#12233b;color:#eaf4ff;' +
              'font-size:14px;cursor:pointer">Vider le cache et recharger</button>' +
              '<div style="font-size:10px;color:#5f7590;margin-top:14px;word-break:break-all">' + (detail || "") + '</div>' +
            '</div>' +
          '</div>';
        var btn = document.getElementById("__focude_reset");
        if (btn) btn.onclick = function () {
          btn.textContent = "Nettoyage…";
          var jobs = [];
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          Promise.all(jobs).catch(function () {}).then(function () {
            // `location.hash` est volontairement conservé : s'il s'agissait d'un
            // retour de lien de confirmation, le rechargement doit encore
            // pouvoir l'exploiter.
            location.reload();
          });
        };
      }

      // Une erreur de chargement de script ne remonte pas dans window.onerror
      // sous forme exploitable : on garde donc aussi le contrôle par le temps.
      window.addEventListener("error", function (e) {
        if (e && e.target && e.target.tagName === "SCRIPT") {
          setTimeout(function () { showFallback("script: " + (e.target.src || "").split("/").pop()); }, 1500);
        }
      }, true);

      window.addEventListener("load", function () {
        setTimeout(function () { showFallback(""); }, 8000);
      });
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      // Un nouveau service worker prend le contrôle en arrière-plan, mais la page
      // déjà ouverte continue de tourner avec l'ancien tant qu'elle n'est pas
      // rechargée : sans ce guard, il fallait recharger deux fois pour voir une
      // mise à jour (le premier rechargement servait encore l'ancien contenu).
      // On déclenche donc UN seul rechargement automatique, exactement quand le
      // nouveau service worker prend la main.
      let reloadedForUpdate = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadedForUpdate) return;
        reloadedForUpdate = true;
        window.location.reload();
      });
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
    }
  </script>
